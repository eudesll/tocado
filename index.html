<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Repertório musical local-first: organize músicas, cantores, tons, letras, vídeos e revisões espaçadas.">
  <meta name="theme-color" content="#2f6f5e">
  <title>Repertório — Suas músicas</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica o tema antes da primeira pintura para evitar flash claro/escuro.
    (function () {
      try {
        var saved = localStorage.getItem('repertorio_theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme',
          saved === 'dark' || saved === 'light' ? saved : (dark ? 'dark' : 'light'));
      } catch (e) { /* preferência do sistema */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#viewContainer">Pular para o conteúdo</a>
  <div class="app">
    <!-- ===================== CABEÇALHO ===================== -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">&#9834;</span>
        <span class="brand-name">Repertório</span>
      </div>

      <nav class="nav" id="nav" aria-label="Navegação principal">
        <button type="button" class="nav-item active" data-view="songs" aria-current="page">Músicas</button>
        <button type="button" class="nav-item" data-view="singers">Cantores</button>
        <span class="nav-divider" aria-hidden="true"></span>
        <button type="button" class="nav-item nav-secondary" data-view="dashboard">Resumo</button>
        <button type="button" class="nav-item nav-secondary" data-view="practice">Revisões <span class="badge" id="navDue">0</span></button>
        <button type="button" class="nav-item nav-secondary" data-view="data">Dados</button>
      </nav>

      <button type="button" class="theme-toggle" id="themeToggle" data-action="toggle-theme" title="Alternar tema claro/noturno" aria-label="Alternar tema" aria-pressed="false">&#127769;</button>
    </header>

    <!-- ===================== CONTEÚDO ===================== -->
    <main class="main">
      <div class="page-head">
        <div>
          <h1 id="viewTitle">Músicas</h1>
          <p class="view-subtitle" id="viewSubtitle">Todas as músicas do seu repertório</p>
        </div>
        <div class="page-actions" id="topbarActions"></div>
      </div>

      <div class="view-container" id="viewContainer" tabindex="-1"></div>
    </main>
  </div>

  <!-- ===================== MODAL ===================== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <div class="modal-header">
        <h2 id="modalTitle">Título</h2>
        <button type="button" class="icon-btn" id="modalClose" data-action="modal-close" aria-label="Fechar">&times;</button>
      </div>
      <form id="modalForm">
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="modalCancel" data-action="modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="modalSubmit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script src="js/http.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/spaced-repetition.js"></script>
  <script src="js/artist-photo.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/song-key.js"></script>
  <script src="js/song-lyrics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
